<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="form-publicacion">
        <input id="titulo" placeholder="Título" required>
        <textarea id="descripcion" placeholder="Descripción"></textarea>
        <input id="autor" placeholder="Nombre del autor" required>
        <div>
            <label for="input-email">Email del autor:</label>
            <input type="email" id="input-email" name="email" placeholder="ejemplo@dominio.com">
            <small id="ayuda-email" class="texto-ayuda"></small>
        </div>
        <select id="tipo">
        <option value="venta">Venta</option>
        <option value="servicio">Servicio</option>
        </select>
        <div id="campos-especificos"></div>
        <button>Publicar</button>
    </form>
<output id="vista-previa"></output>
<section id="lista-publicaciones"></section>

<script type="module" src="./main.js"></script>
</body>
</html>
